<!doctype html>
<!-- Fonte da imagem docs/hero.png (1600x900). Para gerar de novo:
     msedge --headless --hide-scrollbars --window-size=1600,900 --screenshot=docs\hero.png docs\hero.html -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;width:1600px;height:900px;overflow:hidden;background:#0F0F11;color:#F2F2F3;
    font-family:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .text{position:absolute;left:96px;top:140px;width:520px}
  .logo{height:56px;display:block}
  h1{margin:48px 0 0;font-size:56px;line-height:1.08;font-weight:600;letter-spacing:-1.5px}
  p{margin:24px 0 0;font-size:22px;line-height:1.5;color:rgba(242,242,243,.64)}
  ul{list-style:none;margin:40px 0 0;padding:0;font-family:"Cascadia Mono",Consolas,monospace;font-size:17px;line-height:2;color:rgba(242,242,243,.64)}
  li b{color:#4D9BFF;font-weight:400;margin-right:12px}
  .shot{position:absolute;left:696px;top:112px;width:1100px;border-radius:12px;box-shadow:0 0 0 1px rgba(255,255,255,.10),0 40px 120px rgba(0,0,0,.6)}
</style>
</head>
<body>
  <div class="text">
    <img class="logo" src="logo.png" alt="MecDrive">
    <h1>Pastas do Google Drive, exatamente como estão</h1>
    <p>Cole o link, escolha o que quer e baixe. Mesmos nomes, mesmas subpastas, sem zip e sem arquivo dividido em partes.</p>
    <ul>
      <li><b>01</b>vários links de uma vez</li>
      <li><b>02</b>nunca sobrescreve nem apaga</li>
      <li><b>03</b>continua de onde parou</li>
    </ul>
  </div>
  <img class="shot" src="app.png" alt="">
</body>
</html>
